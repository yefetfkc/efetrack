{% load i18n %}

{% if results %}
  <div class="absolute z-10 w-full mt-1 bg-ef-raised rounded-md shadow-lg border border-gray-600 max-h-60 overflow-auto">
    {% for tv in results %}
      <button type="button"
              class="w-full px-4 py-2 text-left text-sm text-gray-300 hover:bg-ef-card hover:text-ef-fg"
              onclick="document.getElementById('parent-tv-input').value = '{{ tv.item.title }}'; document.getElementById('parent-tv-id').value = '{{ tv.id }}'; document.getElementById('parent-tv-results').innerHTML = '';">
        {{ tv.item.title }}
      </button>
    {% endfor %}
  </div>
{% elif query %}
  <div class="absolute z-10 w-full mt-1 bg-ef-raised rounded-md shadow-lg border border-gray-600 p-3">
    <p class="text-sm text-gray-400">{% trans "No TV shows found matching" %} "{{ query }}". {% trans "Please try a different search term." %}</p>
  </div>
{% endif %}
