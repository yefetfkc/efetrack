{% extends "allauth/layouts/base.html" %}
{% load allauth account %}
{% load static %}

{% block body %}
  <div class="flex min-h-screen bg-ef-page text-gray-100">
    <div class="flex-1 flex flex-col justify-center lg:pb-40 items-center p-4">
      <div class="w-full max-w-md">
        <div class="text-center mb-8">
          <h1 class="mb-3 flex justify-center">
            <span class="sr-only">efeTrack</span>
            <img src="{% static 'img/brand/efetrack-logo-dark.svg' %}" alt="efeTrack" class="ef-only-dark h-12 w-auto">
            <img src="{% static 'img/brand/efetrack-logo-light.svg' %}" alt="efeTrack" class="ef-only-light h-12 w-auto">
          </h1>

          <p class="text-gray-400">
            {% block content_title %}
            {% endblock content_title %}
          </p>

        </div>
        <div class="bg-ef-card rounded-lg p-8 shadow-lg">
          {% block content %}
          {% endblock content %}
        </div>
      </div>
    </div>
  </div>

{% endblock body %}
