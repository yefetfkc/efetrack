{# efeTrack: "on this day" home card. Needs: years (list of on_this_day.YearAgo) #}
<section class="bg-ef-card rounded-lg p-4 shadow-lg" aria-label="Geçmiş yıllarda bugün">
  {% for year in years %}
    <div class="{% if not forloop.first %}mt-4{% endif %}">
      <h2 class="text-sm font-semibold text-gray-300 mb-2">
        <span aria-hidden="true">🕰️</span> {{ year.heading }}
        <span class="text-xs text-gray-400 font-normal">· {{ year.day|date:"j F Y" }}</span>
      </h2>
      <div class="flex gap-3 overflow-x-auto pb-1">
        {% for entry in year.entries %}
          <a href="{{ entry.url }}" class="flex items-center gap-3 bg-ef-raised hover:bg-ef-hover rounded-md p-2 transition-colors" style="min-width: 15rem; max-width: 18rem;">
            <img alt="{{ entry.title }}" src="{{ IMG_NONE }}" data-src="{{ entry.image }}"
                 class="lazyload rounded {% if entry.image != IMG_NONE %}object-cover{% endif %}"
                 style="width: 2.5rem; height: 3.75rem; flex-shrink: 0;">
            <span class="min-w-0">
              <span class="block text-sm font-semibold text-ef-fg line-clamp-1" title="{{ entry.title }}">{{ entry.title }}</span>
              <span class="block text-xs text-gray-400 line-clamp-2">{{ entry.text }}</span>
            </span>
          </a>
        {% endfor %}
      </div>
    </div>
  {% endfor %}
</section>
